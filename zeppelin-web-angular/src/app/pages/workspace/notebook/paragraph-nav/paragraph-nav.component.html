<div class="nav-container" *ngIf="nodes.length > 0">
  <div class="nav-track">
    <div class="nav-node-wrapper"
         *ngFor="let node of nodes; let i = index; trackBy: trackById"
         [style.top.%]="getNodeTop(i)"
         [class.first-node]="i === 0"
         [class.last-node]="i === nodes.length - 1"
         (mouseenter)="onNodeMouseEnter(node.id)"
         (mouseleave)="onNodeMouseLeave()">

      <div class="nav-node"
           [class.current-viewing]="isCurrentViewing(node.id)"
           [class.locked]="node.isLocked"
           [class.running]="node.status === 'RUNNING'"
           [class.pending]="node.status === 'PENDING'"
           (click)="onNodeClick(node.id)">

        <!-- Status dot -->
        <div class="node-dot"
             [style.background]="node.status === 'READY' ? 'transparent' : getStatusColor(node.status)"
             [style.border-color]="getStatusColor(node.status)">
          <i *ngIf="node.status === 'RUNNING'" nz-icon nzType="sync" nzTheme="outline" class="spin-icon"></i>
          <i *ngIf="node.status === 'ERROR'" nz-icon nzType="close" nzTheme="outline" class="error-icon"></i>
          <i *ngIf="node.status === 'ABORT'" nz-icon nzType="exclamation" nzTheme="outline" class="abort-icon"></i>
        </div>

        <!-- Lock indicator -->
        <div class="node-lock" *ngIf="node.isLocked">
          <i nz-icon nzType="lock" nzTheme="fill"></i>
        </div>
      </div>

      <!-- Hover tooltip -->
      <div class="nav-tooltip" *ngIf="hoveredNodeId === node.id">
        <div class="tooltip-header">
          <span class="tooltip-title">{{ node.title }}</span>
          <button class="tooltip-lock-btn"
                  [class.locked]="node.isLocked"
                  (click)="onLockToggle(node.id, $event)"
                  title="{{ node.isLocked ? 'Unlock' : 'Lock this paragraph' }}">
            <i nz-icon [nzType]="node.isLocked ? 'lock' : 'unlock'" nzTheme="fill"></i>
          </button>
        </div>
        <div class="tooltip-status">
          <span class="status-dot" [style.background]="getStatusColor(node.status)"></span>
          <span class="status-label">{{ getStatusLabel(node.status) }}</span>
          <span class="status-duration" *ngIf="node.duration">{{ node.duration }}</span>
        </div>
        <pre class="tooltip-code" *ngIf="node.fullCode">{{ node.fullCode }}</pre>
        <div class="tooltip-error" *ngIf="node.status === 'ERROR' && node.errorMessage">
          <i nz-icon nzType="exclamation-circle" nzTheme="outline"></i>
          {{ node.errorMessage }}
        </div>
      </div>
    </div>
  </div>
</div>
