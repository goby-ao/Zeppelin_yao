<div class="note-create-body">
  <form nz-form nzLayout="vertical">
    <nz-form-item>
      <nz-form-label>
        <ng-container *ngIf="cloneNote; else createTpl">克隆为</ng-container>
        <ng-template #createTpl>笔记名称</ng-template>
      </nz-form-label>
      <nz-form-control>
        <input nz-input [(ngModel)]="noteName" autofocus placeholder="请输入笔记名称" name="noteName" nzSize="large"/>
      </nz-form-control>
    </nz-form-item>
    <nz-form-item *ngIf="!cloneNote">
      <nz-form-label>默认解释器</nz-form-label>
      <nz-form-control>
        <nz-select [(ngModel)]="defaultInterpreter" name="defaultInterpreter" nzPlaceHolder="选择默认解释器" nzShowSearch>
          <nz-option *ngFor="let i of listOfInterpreter" [nzValue]="i.name" [nzLabel]="i.name"></nz-option>
        </nz-select>
      </nz-form-control>
    </nz-form-item>
    <div class="hint-text">
      <i nz-icon nzType="info-circle" nzTheme="outline"></i>
      使用 <code>/</code> 创建目录，例如：<code>/目录A/笔记1</code>
    </div>
  </form>
  <div class="note-create-footer">
    <button nz-button (click)="createNote()" nzType="primary" nzBlock>
      <ng-container *ngIf="cloneNote; else createBtnTpl">克隆</ng-container>
      <ng-template #createBtnTpl>创建</ng-template>
    </button>
  </div>
</div>
