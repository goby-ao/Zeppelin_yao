<div class="panel panel-default zp-table-setting-panel">
  <div class="panel-heading zp-table-setting-header">
    <span class="zp-table-setting-title">表格设置</span>
    <div class="zp-table-setting-actions" role="group" aria-label="表格设置操作">
      <button type="button"
              ng-click="applyTableOption()"
              uib-tooltip="保存当前设置并收起面板"
              tooltip-placement="top"
              class="btn btn-default zp-table-setting-action zp-table-setting-save">
        <i class="fa fa-floppy-o" aria-hidden="true"></i>
        <span>保存</span>
      </button>

      <button type="button"
              ng-click="resetTableOption()"
              uib-tooltip="恢复默认设置"
              tooltip-placement="top"
              class="btn btn-default zp-table-setting-action">
        <i class="fa fa-undo" aria-hidden="true"></i>
        <span>恢复</span>
      </button>

      <button type="button"
              ng-click="closeTableOption()"
              uib-tooltip="收起结果设置面板"
              tooltip-placement="top"
              class="btn btn-default zp-table-setting-action zp-table-setting-close">
        <i class="fa fa-chevron-up" aria-hidden="true"></i>
        <span>收起设置</span>
      </button>
    </div>
  </div>

  <div class="panel-body zp-table-setting-body">
    <table class="table table-striped zp-table-setting-table">
      <tr>
        <th>选项</th>
        <th>值</th>
      </tr>
      <tr>
      </tr>

      <tr data-ng-repeat="optSpec in tableOptionSpecs">
        <td class="zp-table-setting-option-name">
          <span uib-tooltip="{{getTableOptionDescription(optSpec)}}"
                tooltip-placement="right">
            {{getTableOptionName(optSpec)}}
            <i class="fa fa-info-circle" aria-hidden="true"></i>
          </span>
        </td>
        <td>
          <div ng-if="isInputWidget(optSpec)"
               class="input-group">
            <input type="text" class="form-control input-sm"
                   style="font-weight: 400; font-size: 12px; vertical-align:middle; border-radius: 5px;"
                   ng-keydown="tableWidgetOnKeyDown($event, optSpec)"
                   data-ng-model="config.tableOptionValue[optSpec.name]" />
          </div>
          <div class="btn-group"
               ng-if="isOptionWidget(optSpec)">
            <select class="form-control input-sm"
                    ng-change="tableOptionValueChanged(optSpec)"
                    data-ng-model="config.tableOptionValue[optSpec.name]"
                    data-ng-options="optionValue for optionValue in optSpec.optionValues"
                    style="font-weight: 400; font-size: 12px;">
            </select>
          </div>

          <div ng-if="isCheckboxWidget(optSpec)">
            <input type="checkbox"
                   ng-keydown="parameterOnKeyDown($event, optSpec)"
                   ng-click="tableOptionValueChanged(optSpec)"
                   data-ng-model="config.tableOptionValue[optSpec.name]"
                   data-ng-checked="config.tableOptionValue[optSpec.name]" />
          </div>

          <div ng-if="isTextareaWidget(optSpec)">
            <textarea class="form-control" rows="3"
                      ng-keydown="tableWidgetOnKeyDown($event, optSpec)"
                      data-ng-model="config.tableOptionValue[optSpec.name]"
                      style="font-weight: 400; font-size: 12px;">
            </textarea>
          </div>

        </td>
      </tr>
    </table>
  </div>
</div>
