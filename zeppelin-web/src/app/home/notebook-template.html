<div ng-class="note_folder_renderer">
  <!-- note -->
  <div ng-if="node.children == null && isFilterNote(node)" class="note-folder-item">
    <a class="note-name" style="text-decoration: none;" href="#/notebook/{{node.id}}">
      <i ng-class="query.q && node.isTrash ? 'fa fa-trash-o' : 'fa fa-file-text-o'"></i>
      <span>{{getNoteName(node)}}</span>
    </a>
    <span class="note-folder-item-actions">
      <!-- 非悬停状态：只显示更多按钮 -->
      <a class="note-action-more" ng-if="!node.isTrash">
        <i class="fa fa-ellipsis-h"></i>
      </a>
      <!-- 悬停状态显示的操作 -->
      <span class="note-action-hover">
        <a ng-if="!node.isTrash" style="text-decoration: none;">
          <i class="fa fa-pencil notebook-list-btn"
             ng-click="node.path ? renameNote(node.id, node.path) : renameNote(node.id, node.name)"
             tooltip-placement="bottom" uib-tooltip="重命名笔记">
          </i>
        </a>
        <a ng-if="!node.isTrash" style="text-decoration: none;">
          <i class="fa fa-eraser notebook-list-btn" ng-click="clearAllParagraphOutput(node.id)"
             tooltip-placement="bottom" uib-tooltip="清空输出">
          </i>
        </a>
        <a ng-if="!node.isTrash" style="text-decoration: none;">
          <i class="fa fa-trash-o notebook-list-btn" ng-click="moveNoteToTrash(node.id)"
             tooltip-placement="bottom" uib-tooltip="移动笔记到回收站">
          </i>
        </a>
      </span>
      <!-- 回收站中的操作 -->
      <a ng-if="node.isTrash">
        <i class="fa fa-undo notebook-list-btn" ng-click="restoreNote(node.id)"
           tooltip-placement="bottom" uib-tooltip="恢复笔记">
        </i>
      </a>
      <a ng-if="node.isTrash">
        <i class="fa fa-times notebook-list-btn" ng-click="removeNote(node.id)"
           tooltip-placement="bottom" uib-tooltip="永久删除笔记">
        </i>
      </a>
    </span>
  </div>

  <!-- folder -->
  <div ng-if="node.children != null && node.id !== TRASH_FOLDER_ID">
    <div class="note-folder-item">
      <a class="folder-name" style="text-decoration: none; cursor: pointer;" ng-click="toggleFolderNode(node)">
        <i ng-class="node.hidden ? 'fa fa-folder' : 'fa fa-folder-open'"></i>
        <span>{{getNoteName(node)}}</span>
      </a>
      <span class="note-folder-item-actions">
        <!-- 非悬停状态：只显示更多按钮 -->
        <a class="note-action-more" ng-if="!node.isTrash">
          <i class="fa fa-ellipsis-h"></i>
        </a>
        <!-- 悬停状态显示的操作 -->
        <span class="note-action-hover">
          <a ng-if="!node.isTrash" href="" data-toggle="modal" data-target="#noteCreateModal"
             style="text-decoration: none;"
             ng-controller="NoteCreateCtrl as noteCreateCtrl"
             ng-click="noteCreateCtrl.getInterpreterSettings()" data-path="{{node.id}}">
            <i class="fa fa-plus notebook-list-btn"
               tooltip-placement="bottom" uib-tooltip="新建笔记">
            </i>
          </a>
          <a ng-if="!node.isTrash" style="text-decoration: none;">
            <i class="fa fa-pencil notebook-list-btn" ng-click="renameFolder(node)"
               tooltip-placement="bottom" uib-tooltip="重命名目录">
            </i>
          </a>
          <a ng-if="!node.isTrash">
            <i class="fa fa-trash-o notebook-list-btn" ng-click="moveFolderToTrash(node.id)"
               tooltip-placement="bottom" uib-tooltip="移动目录到回收站">
            </i>
          </a>
        </span>
        <!-- 回收站中的操作 -->
        <a ng-if="node.isTrash">
          <i class="fa fa-undo notebook-list-btn" ng-click="restoreFolder(node.id)"
             tooltip-placement="bottom" uib-tooltip="恢复目录">
          </i>
        </a>
        <a ng-if="node.isTrash">
          <i class="fa fa-times notebook-list-btn" ng-click="removeFolder(node.id)"
             tooltip-placement="bottom" uib-tooltip="永久删除目录">
          </i>
        </a>
      </span>
    </div>
    <div ng-if="!node.hidden">
      <ul style="list-style-type: none; padding-left: 20px;">
        <li ng-repeat="node in node.children | orderBy:node:false:noteComparator" ng-include="'app/home/notebook-template.html'" ng-class="'note_folder_renderer'"></li>
      </ul>
    </div>
  </div>
  <!-- trash folder -->
  <div ng-if="node.id === TRASH_FOLDER_ID">
    <div class="note-folder-item">
      <a class="folder-name" style="text-decoration: none; cursor: pointer;" ng-click="toggleFolderNode(node)">
        <i class="fa fa-trash-o"></i>
        <span>回收站</span>
      </a>
      <span class="note-folder-item-actions">
        <a style="text-decoration: none;">
          <i class="fa fa-undo notebook-list-btn" ng-click="restoreAll()"
             tooltip-placement="bottom" uib-tooltip="全部恢复">
          </i>
        </a>
        <a style="text-decoration: none;">
          <i class="fa fa-times notebook-list-btn" ng-click="emptyTrash()"
             tooltip-placement="bottom" uib-tooltip="清空回收站">
          </i>
        </a>
      </span>
    </div>
    <div ng-if="!node.hidden">
      <ul style="list-style-type: none; padding-left: 20px;">
        <li ng-repeat="node in node.children | orderBy:node:false:noteComparator" ng-include="'app/home/notebook-template.html'" ng-class="'note_folder_renderer'"></li>
      </ul>
    </div>
  </div>
</div>
