<div ng-controller="HomeCtrl as home" data-ng-init="initHome()">
<!--  <div ng-show="home.staticHome" class="box width-full home">-->
<!--  解决白屏问题-->
  <div class="box width-full home">
    <div class="zeppelin">
      <div class="zeppelin2"></div>
    </div>
    <div>
      <h1 class="box-heading" id="welcome" style="font-size: 24px">
        欢迎使用 Zeppelin 数据探索工具！
      </h1>
      你可以在一个笔记本中同时使用 <code>SQL</code>、<code>Shell</code>、<code>Python</code> 等代码，完成交互式查询、分析和协作。<br/>
      <br/>
      <div class="row">
        <div class="col-md-6 home-side-panel">
          <div class="home-module">
            <div class="home-module-header">
              <h4><i class="fa fa-rocket" style="margin-right: 8px; color: #3b82f6;"></i>快速开始</h4>
              <span>选择常用引擎快速开始</span>
            </div>
            <div class="quick-analysis-list">
              <button type="button" class="quick-analysis-card quick-analysis-hive"
                      ng-click="quickCreate('hive')">
                <span class="quick-analysis-icon"><i class="fa fa-database"></i></span>
                <span class="quick-analysis-content">
                  <strong>开始 Hive 查询</strong>
                  <small>适合数据查询与分析</small>
                </span>
                <i class="fa fa-angle-right quick-analysis-arrow"></i>
              </button>
              <button type="button" class="quick-analysis-card quick-analysis-spark"
                      ng-click="quickCreate('spark')">
                <span class="quick-analysis-icon"><i class="fa fa-bolt"></i></span>
                <span class="quick-analysis-content">
                  <strong>开始 Spark 分析</strong>
                  <small>适合大规模计算与探索</small>
                </span>
                <i class="fa fa-angle-right quick-analysis-arrow"></i>
              </button>
              <button type="button" class="quick-analysis-card quick-analysis-python"
                      ng-click="quickCreate('python')">
                <span class="quick-analysis-icon"><i class="fa fa-code"></i></span>
                <span class="quick-analysis-content">
                  <strong>Python 脚本</strong>
                  <small>适合脚本处理与建模分析</small>
                </span>
                <i class="fa fa-angle-right quick-analysis-arrow"></i>
              </button>
              <button type="button" class="quick-analysis-card quick-analysis-shell"
                      ng-click="quickCreate('shell')">
                <span class="quick-analysis-icon"><i class="fa fa-terminal"></i></span>
                <span class="quick-analysis-content">
                  <strong>Shell 脚本</strong>
                  <small>适合命令与批处理脚本</small>
                </span>
                <i class="fa fa-angle-right quick-analysis-arrow"></i>
              </button>
            </div>
          </div>

          <div class="home-module home-recent-module">
            <div class="home-module-header">
              <h4><i class="fa fa-clock-o" style="margin-right: 8px; color: #3b82f6;"></i>最近使用</h4>
              <span>快速回到最近打开的笔记</span>
            </div>
            <ul class="recent-notes-list" ng-if="recentNotes.length > 0">
              <li ng-repeat="recentNote in recentNotes track by recentNote.id"
                  ng-class="{'recent-note-starred': recentNote.starred, 'recent-note-deleted': isNoteDeleted(recentNote.id)}">
                <span class="recent-note-star" ng-click="toggleStar(recentNote, $event)"
                      ng-if="!isNoteDeleted(recentNote.id)">
                  <i ng-class="recentNote.starred ? 'fa fa-star' : 'fa fa-star-o'"></i>
                </span>
                <span class="recent-note-deleted-badge" ng-if="isNoteDeleted(recentNote.id)">
                  <i class="fa fa-trash-o"></i>
                </span>
                <a ng-if="!isNoteDeleted(recentNote.id)" href="#/notebook/{{recentNote.id}}" class="recent-note-link">
                  <span class="recent-note-name">{{recentNote.name}}</span>
                  <span class="recent-note-time">{{formatRecentTime(recentNote.time)}}</span>
                </a>
                <span ng-if="isNoteDeleted(recentNote.id)" class="recent-note-link recent-note-deleted-text">
                  <span class="recent-note-name">{{recentNote.name}}</span>
                  <span class="recent-note-time">已删除</span>
                </span>
                <span class="recent-note-remove" ng-if="isNoteDeleted(recentNote.id)"
                      ng-click="removeRecentNote(recentNote, $event)" title="从列表移除">
                  <i class="fa fa-times"></i>
                </span>
              </li>
            </ul>
            <div class="recent-notes-empty" ng-if="recentNotes.length === 0">
              暂无最近使用的笔记
            </div>
          </div>
        </div>
        <div class="col-md-6 home-notes-panel" ng-if="ticket">
          <!-- 操作按钮区 - 卡片外部右上角 -->
          <div class="home-notes-top-actions">
            <a href="" class="home-note-action home-note-action-create"
               ng-controller="NoteCreateCtrl as noteCreateCtrl"
               data-toggle="modal"
               data-target="#noteCreateModal"
               ng-click="noteCreateCtrl.getInterpreterSettings()">
              <i class="fa fa-plus" style="color: white; font-size: 14px; margin-right: 10px; vertical-align: middle;"></i> 新建笔记
            </a>
            <a href="" class="home-note-action"
               data-toggle="modal"
               data-target="#noteImportModal">
              <i class="fa fa-upload"></i> 导入
            </a>
            <button type="button" class="home-notes-refresh"
                    ng-style="!isReloadingNotes && {'cursor': 'pointer'}"
                    ng-click="reloadNoteList();"
                    tooltip-placement="bottom"
                    uib-tooltip="从存储重新加载笔记">
              <i ng-class="isReloadingNotes ? 'fa fa-refresh fa-spin' : 'fa fa-refresh'"></i>
            </button>
          </div>
          <!-- 笔记卡片 -->
          <div class="home-notes-card">
            <div class="home-notes-card-header">
              <h4><i class="fa fa-book" style="margin-right: 8px; color: #3b82f6;"></i>笔记</h4>
              <div class="home-notes-search">
                <input type="text"
                       class="note-name-query form-control"
                       placeholder="&#xf002   按名称搜索笔记"
                       ng-model="query.q"
                       ng-model-options="{ updateOn: 'default blur', debounce: { 'default': 300, 'blur': 0 } }" />
              </div>
            </div>
            <ul id="notebook-names" class="home-notes-list">
              <li ng-repeat="note in home.notes.list | filter:query.q track by $index">
                <i style="font-size: 10px;" class="icon-doc"></i>
                <a style="text-decoration: none;" href="#/notebook/{{note.id}}">{{noteName(note)}}</a>
              </li>
              <div ng-if="!query.q || query.q === ''" infinite-scroll="loadMoreNotes()">
                <li ng-repeat="node in home.notes.root.children | limitTo:home.numberOfNotesDisplayed track by $index"
                    ng-include src="'app/home/notebook-template.html'" ng-class="note_folder_renderer"></li>
              </div>
              <div ng-if="query.q" infinite-scroll="loadMoreNotes()">
                <li ng-repeat="node in home.notes.flatList | filter:query.q | orderBy:home.arrayOrderingSrv.noteFlatListOrdering | limitTo:home.numberOfNotesDisplayed track by $index"
                    ng-include src="'app/home/notebook-template.html'" ng-class="note_folder_renderer"></li>
              </div>
            </ul>
          </div>
        </div>
      </div>
    </div>
    <br/><br/><br/>
  </div>


  <!-- Load notebook -->
  <div ng-show="home.notebookHome" id="{{currentParagraph.id}}_paragraphColumn_main"
       ng-repeat="currentParagraph in home.note.paragraphs"
       ng-controller="ParagraphCtrl"
       ng-init="init(currentParagraph, home.note)"
       ng-class="columnWidthClass(currentParagraph.config.colWidth)"
       style="margin: 0; padding: 0;">
    <div id="{{currentParagraph.id}}_paragraphColumn"
         ng-if="currentParagraph.results"
         ng-include src="'app/notebook/paragraph/paragraph.html'"
         ng-class="{'paragraph-space box paragraph-margin': !asIframe, 'focused': paragraphFocused}"
         ng-hide="currentParagraph.config.tableHide && home.viewOnly">
    </div>
  </div>

  <div style="clear:both;height:10px"></div>
</div>
