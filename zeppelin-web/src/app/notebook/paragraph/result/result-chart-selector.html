<div class="zp-result-action-strip"
     ng-if="$index === 0 && !asIframe && !viewOnly">

  <div id="{{id}}_switch"
       ng-if="type == 'TABLE' || type == 'NETWORK'"
       class="zp-result-chart-selector"
       uib-dropdown
       dropdown-append-to-body="true">

    <button type="button"
            class="zp-result-tools-trigger"
            uib-dropdown-toggle
            tooltip-placement="bottom"
            tooltip-append-to-body="true"
            uib-tooltip="结果视图">
      <i class="fa fa-table"></i>
      <span>结果视图</span>
      <i class="fa fa-caret-down zp-result-tools-caret"></i>
    </button>

    <ul class="dropdown-menu dropdown-menu-right zp-result-tools-menu"
        uib-dropdown-menu
        role="menu">
      <li class="zp-result-tools-title">可视化方式</li>
      <li ng-repeat="viz in builtInTableDataVisualizationList track by $index"
          ng-if="viz.supports.indexOf(type) > -1">
        <button type="button"
                class="zp-result-tools-item"
                ng-class="{'active' : viz.id == graphMode && !config.helium.activeApp}"
                ng-click="switchViz(viz.id)">
          <span class="zp-result-tools-icon" ng-bind-html="viz.icon"></span>
          <span class="zp-result-tools-label" ng-switch="viz.id">
            <span ng-switch-when="table">表格</span>
            <span ng-switch-when="multiBarChart">柱状图</span>
            <span ng-switch-when="pieChart">饼图</span>
            <span ng-switch-when="stackedAreaChart">面积图</span>
            <span ng-switch-when="lineChart">折线图</span>
            <span ng-switch-when="scatterChart">散点图</span>
            <span ng-switch-when="network">网络图</span>
            <span ng-switch-default>{{viz.name ? viz.name : '视图'}}</span>
          </span>
          <i class="fa fa-check zp-result-tools-check"
             ng-if="viz.id == graphMode && !config.helium.activeApp"></i>
        </button>
      </li>

      <li class="zp-result-tools-title" ng-if="apps.length > 0">解释器应用</li>
      <li ng-repeat="app in apps">
        <button type="button"
                class="zp-result-tools-item"
                ng-class="{'active' : app.id == config.helium.activeApp}"
                ng-click="switchApp(app.id)">
          <span class="zp-result-tools-icon" ng-bind-html="app.pkg.icon"></span>
          <span class="zp-result-tools-label">{{app.pkg.name ? app.pkg.name : '解释器应用'}}</span>
          <i class="fa fa-check zp-result-tools-check"
             ng-if="app.id == config.helium.activeApp"></i>
        </button>
      </li>

      <li role="separator" class="divider" ng-if="!config.helium.activeApp"></li>
      <li ng-if="!config.helium.activeApp">
        <button type="button"
                class="zp-result-tools-item"
                ng-class="{'active' : config.graph.optionOpen}"
                ng-click="toggleGraphSetting()">
          <i class="fa fa-sliders zp-result-tools-icon-fa"></i>
          <span class="zp-result-tools-label">结果设置</span>
          <i class="fa"
             ng-class="config.graph.optionOpen ? 'fa-caret-up' : 'fa-caret-down'"></i>
        </button>
      </li>
    </ul>
  </div>

  <button type="button"
          class="zp-result-clear-output"
          ng-click="clearCurrentResultOutput()"
          ng-disabled="paragraph.status === 'RUNNING' || paragraph.status === 'PENDING'"
          tooltip-placement="bottom"
          tooltip-append-to-body="true"
          uib-tooltip="清空当前结果输出">
    <i class="fa fa-eraser"></i>
  </button>
</div>

<div id="{{paragraph.id}}_helium"
     ng-if="(suggestion.available && suggestion.available.length > 0) && !asIframe && !viewOnly"
     class="btn-group"
     style="margin-bottom: 10px;">
  <button type="button"
          class="btn btn-default btn-sm dropdown-toggle"
          data-toggle="dropdown"
          style="font-weight:bold; background-color:#ffdf96; border: 1px solid #FED233">
    He
  </button>
  <ul class="dropdown-menu"
      style="z-index:1002"
      ng-if="suggestion.available && suggestion.available.length > 0"
      role="menu">
    <li class="appSuggestion">
      <div ng-repeat="pkgInfo in suggestion.available"
           style="margin-bottom:5px">
        <button type="button"
                class="btn btn-default btn-sm"
                ng-click="loadApp(pkgInfo.pkg)"
                ng-bind-html="pkgInfo.pkg.icon">
        </button>
        <span class="inline">{{pkgInfo.pkg.name}}</span>
      </div>
    </li>
  </ul>
</div>

<div class="btn-group"
     ng-if="(type == 'TABLE' || type == 'NETWORK') && !asIframe && !viewOnly"
     style="margin-bottom: 10px;display:none;">
  <button type="button" class="btn btn-default btn-sm"
          style="margin-left:10px;"
          ng-click="exportToDSV(',')"
          uib-tooltip="下载 CSV 数据" tooltip-placement="bottom">
    <i class="fa fa-download"></i>
  </button>
  <button type="button" class="btn btn-default btn-sm dropdown-toggle caretBtn"
          data-toggle="dropdown" style="display:none">
    <span class="caret" style="margin: 0px;"></span>
    <span class="sr-only">切换下拉菜单</span>
  </button>
  <!--<ul class="dropdown-menu" role="menu" style="min-width: 70px;">
    <li ng-click="exportToDSV(',')"><a>CSV</a></li>
    <li ng-click="exportToDSV('\t')"><a>TSV</a></li>
  </ul>-->
</div>
