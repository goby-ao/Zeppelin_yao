<div>
  <div ng-include src="'app/notebook/paragraph/result/result-chart-selector.html'"></div>
  <div
    ng-mouseout="onMouseOut()"
    ng-mouseover="onMouseOver()"
    id="p{{id}}_resize"
    ng-if="!config.helium.activeApp"
    style="padding-bottom: 0px;"
    resize='{"allowresize": "{{!asIframe && !viewOnly}}", "graphType": "{{type}}"}'
    resizable on-resize="resize(width, height);">

    <div ng-if="type=='TABLE' || type == 'NETWORK'"
         ng-style="getPointerEvent()">
      <!-- setting -->
      <div class="option lightBold" style="overflow: visible;"
           ng-show="config.graph.optionOpen && !asIframe && !viewOnly">
        <div ng-repeat="viz in builtInTableDataVisualizationList track by $index"
             id="trsetting{{id}}_{{viz.id}}"
             ng-show="graphMode == viz.id"></div>
        <div ng-repeat="viz in builtInTableDataVisualizationList track by $index"
             id="vizsetting{{id}}_{{viz.id}}"
             ng-show="graphMode == viz.id"></div>
      </div>

      <div id="p{{id}}_network_header"
           ng-if="type == 'NETWORK' && graphMode == 'network' && networkNodes != null">
         <ul class="list-inline">
           <li>节点 <span class="badge">{{networkNodes.count}}</span>：</li>
           <li ng-repeat="(labelName, labelColor) in networkNodes.labels" style="padding: 0">
             <span style="background-color: {{labelColor}} !important;" class="label label-default network-badge">
               {{labelName}}
             </span>
           </li>
         </ul>
         <ul class="list-inline">
           <li ng-if="networkRelationships != null">关系 <span class="badge">{{networkRelationships.count}}</span>：</li>
           <li ng-repeat="type in networkRelationships.types" style="padding: 0">
             <span class="label label-default network-badge">
               {{type}}
             </span>
           </li>
         </ul>
      </div>

      <!-- graph -->
      <div id="p{{id}}_graph"
           class="graphContainer"
           ng-class="{'noOverflow': graphMode=='table', 'no-copy': $root.disableCopyEnabled}">
        <div ng-repeat="viz in builtInTableDataVisualizationList track by $index"
             id="p{{id}}_{{viz.id}}"
             ng-show="graphMode == viz.id">
        </div>
      </div>

      <div id="p{{id}}_network_footer"
           ng-if="type == 'NETWORK' && graphMode == 'network'">
        <ul class="list-inline">
        </ul>
      </div>

      <div id="{{id}}_comment"
           class="text"
           ng-if="tableDataComment"
           ng-bind-html="tableDataComment">
      </div>
    </div>

    <div ng-if="type == 'TEXT'"
         class="plainTextContainer zp-log-output"
         ng-class="{'is-collapsed': plainTextCollapsible && plainTextCollapsed}"
         ng-style="getPointerEvent()">
      <div class="zp-log-output-toolbar">
        <button type="button"
                class="zp-log-output-toggle"
                ng-if="plainTextCollapsible"
                ng-click="togglePlainTextOutput()"
                ng-attr-aria-expanded="{{!plainTextCollapsed}}"
                uib-tooltip="{{plainTextCollapsed ? '展开日志输出' : '收起日志输出'}}"
                tooltip-placement="top">
          <i class="fa"
             ng-class="plainTextCollapsed ? 'fa-chevron-down' : 'fa-chevron-up'"></i>
          <span>{{plainTextCollapsed ? '展开日志' : '收起日志'}}</span>
        </button>
        <span class="zp-log-output-title">
          <i class="fa fa-terminal"></i>
          日志输出
        </span>
        <span class="zp-log-scroll-actions">
          <button type="button"
                  class="zp-log-scroll-btn"
                  ng-show="!plainTextCollapsed && showScrollDownIcon()"
                  ng-click="scrollParagraphDown()"
                  uib-tooltip="跟随输出"
                  tooltip-placement="top">
            <i class="fa fa-level-down"></i>
          </button>
          <button type="button"
                  class="zp-log-scroll-btn"
                  ng-show="!plainTextCollapsed && showScrollUpIcon()"
                  ng-click="scrollParagraphUp()"
                  uib-tooltip="回到顶部"
                  tooltip-placement="top">
            <i class="fa fa-chevron-up"></i>
          </button>
        </span>
      </div>
      <div class="zp-log-output-body">
        <div id="p{{id}}_text"
             ng-style="getPlainTextOutputStyle()"
             class="text plainTextContent"
             ng-class="{'no-copy': $root.disableCopyEnabled}"></div>
      </div>
    </div>

    <div id="p{{id}}_custom"
         class="resultContained"
         ng-if="!isDefaultDisplay()"
         ng-style="getPointerEvent()">
    </div>

    <div id="p{{id}}_elem"
         class="resultContained"
         ng-if="type == 'ELEMENT'"
         ng-style="getPointerEvent()">
    </div>

    <div id="p{{id}}_html"
         class="resultContained html-result"
         ng-if="type == 'HTML'"
         ng-style="getPointerEvent()">
    </div>

    <div id="p{{id}}_angular"
         class="resultContained"
         ng-if="type == 'ANGULAR'"
         ng-style="getPointerEvent()">
    </div>

    <img id="{{id}}_img"
         ng-if="type == 'IMG'"
         ng-src="{{getBase64ImageSrc(result.data)}}"
         ng-style="getPointerEvent()" />
  </div>

  <div ng-repeat="app in apps">
    <div id="p{{app.id}}"
         ng-show="config.helium.activeApp == app.id"
         ng-style="getPointerEvent()">
    </div>
  </div>
</div>
